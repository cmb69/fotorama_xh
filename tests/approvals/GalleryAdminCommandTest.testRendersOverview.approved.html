
<h1>Fotorama – Galleries</h1>
<ul>
  <li><a href="/?fotorama&amp;admin=plugin_main&amp;action=edit&amp;fotorama_gallery=gallery1">gallery1</a></li>
  <li><a href="/?fotorama&amp;admin=plugin_main&amp;action=edit&amp;fotorama_gallery=gallery2">gallery2</a></li>
</ul>
<form action="/?fotorama" method="post">
  <input type="hidden" name="fotorama_token" value="1234">
  <input type="hidden" name="admin" value="plugin_main">
  <fieldset>
    <legend>Create new gallery</legend>
    <p>
      <label>
        <span>Name</span>
        <input type="text" name="fotorama_gallery"></label>
    </p>
    <p>
      <label>
        <span>Folder</span>
        <select name="fotorama_folder">
          <option>folder1</option>
          <option>folder2</option>
        </select>
      </label>
    </p>
    <p>
      <button class="submit" name="action" value="create">Create</button>
    </p>
  </fieldset>
</form>
