
<article class="fotorama_overview">
  <h1>Fotorama – Galleries</h1>
  <form action="/?&amp;fotorama&amp;admin=plugin_main&amp;action=plugin_tx&amp;normal" method="get">
    <input type="hidden" name="selected" value="fotorama">
    <input type="hidden" name="admin" value="plugin_main">
    <ul>
      <li>
        <input type="radio" name="fotorama_gallery" value="gallery1" id="fotorama_gallery_gallery1" />
        <label for="fotorama_gallery_gallery1">gallery1      </li>
      <li>
        <input type="radio" name="fotorama_gallery" value="gallery2" id="fotorama_gallery_gallery2" />
        <label for="fotorama_gallery_gallery2">gallery2      </li>
    </ul>
    <p class="fotorama_controls">
      <button name="action" value="update">Edit</button>
      <button name="action" value="check">Check</button>
      <button name="action" value="delete">Delete</button>
  </form>
  <form action="/?&amp;fotorama&amp;admin=plugin_main&amp;action=create&amp;normal" method="post">
    <input type="hidden" name="fotorama_token" value="1234">
    <fieldset>
      <legend>Create new gallery</legend>
      <p>
        <label for="fotorama_gallery">
          <span>Name</span>
          <span class="fotorama_help">(only a-z, 0-9 and hyphens)</span>
        </label>
        <input type="text" name="fotorama_gallery" id="fotorama_gallery" value="" required pattern="[a-z0-9\-]+">
      </p>
      <p>
        <label for="fotorama_folder">Folder</label>
        <select name="fotorama_folder" id="fotorama_folder">
          <option >folder1</option>
          <option >folder2</option>
        </select>
      </p>
      <p>
        <button class="submit">Create</button>
      </p>
    </fieldset>
  </form>
</article>
