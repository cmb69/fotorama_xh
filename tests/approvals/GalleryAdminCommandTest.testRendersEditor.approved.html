
<script src="/plugins/fotorama/admin.js?&amp;v=1.0beta2" defer></script>
<article class="fotorama_editor">
  <h1>Fotorama – test</h1>
  <form action="/?&action=update&fotorama_gallery=test" method="post">
    <div class="fotorama_gallery">
      <input type="hidden" name="fotorama_token" value="1234">
      <input type="hidden" name="fotorama_gallery" value="test">
      <p>
        <label for="fotorama_path">Path</label>
        <input id="fotorama_path" class="fotorama_path" name="path" value="test" required>
      </p>
      <p>
        <label for="fotorama_caption">Caption</label>
        <textarea id="fotorama_caption" name="caption" rows="2"></textarea>
      </p>
      <p>
        <label for="fotorama_width">
          <span>Width</span>
          <span class="fotorama_help">(number or percentage)</span>
        </label>
        <input id="fotorama_width" name="width" value="">
      </p>
      <p>
        <label for="fotorama_ratio">
          <span>Aspect ratio</span>
          <span class="fotorama_help">(fraction or decimal number)</span>
        </label>
        <input id="fotorama_ratio" name="ratio" value="">
      </p>
      <p>
        <input type="hidden" name="thumbs" value="">
        <input type="checkbox" id="fotorama_nav" name="thumbs" >
        <label for="fotorama_nav">Thumnnail navigation</label>
      </p>
      <p>
        <label for="fotorama_fullscreen">Fullscreen</label>
        <select id="fotorama_fullscreen" name="fullscreen">
          <option value="" selected>no</option>
          <option value="true" >Viewport</option>
          <option value="native" >Screen</option>
        </select>
      </p>
      <p>
        <label for="fotorama_transition">Transition</label>
        <select id="fotorama_transition" name="transition">
          <option value="slide" selected>Slide</option>
          <option value="crossfade" >Cross-fade</option>
          <option value="dissolve" >Dissolve</option>
        </select>
      </p>
    </div>
    <p class="fotorama_controls">
      <button name="fotorama_do">Save</button>
    </p>
    <input type="hidden" name="gallery_images" value="[]">
    <fieldset class="fotorama_images">
      <legend>Images</legend>
      <p class="fotorama_controls">
        <label>
          <input type="checkbox" class="fotorama_hide_details">
          <span>Hide details</span>
        </label>
        <button class="fotorama_add_image" type="button">Add</button>
      </p>
      <ol data-base-url="">
      </ol>
    </fieldset>
    <p class="fotorama_controls">
      <button name="fotorama_do">Save</button>
    </p>
  </form>
  <template class="fotorama_template">
    <li>
      <input type="image" class="fotorama_thumb" src="" alt="Thumbnail">
      <div class="fotorama_image_details">
        <label>
          <span>Path</span>
          <div class="fotorama_input_plus">
            <input class="fotorama_path" required>
            <button class="fotorama_pick_image" type="button"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1em" height="1em" fill="currentColor"><title>Pick image</title><!--!Font Awesome Free 6.7.2 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2025 Fonticons, Inc.--><path d="M0 96C0 60.7 28.7 32 64 32l384 0c35.3 0 64 28.7 64 64l0 320c0 35.3-28.7 64-64 64L64 480c-35.3 0-64-28.7-64-64L0 96zM323.8 202.5c-4.5-6.6-11.9-10.5-19.8-10.5s-15.4 3.9-19.8 10.5l-87 127.6L170.7 297c-4.6-5.7-11.5-9-18.7-9s-14.2 3.3-18.7 9l-64 80c-5.8 7.2-6.9 17.1-2.9 25.4s12.4 13.6 21.6 13.6l96 0 32 0 208 0c8.9 0 17.1-4.9 21.2-12.8s3.6-17.4-1.4-24.7l-120-176zM112 192a48 48 0 1 0 0-96 48 48 0 1 0 0 96z"/></svg></button>
          </div>
        </label>
        <label>
          <span>Caption</span>
          <div class="fotorama_input_plus">
            <textarea class="fotorama_caption" rows="1"></textarea>
            <div></div>
          </div>
        </label>
      </div>
      <div class="fotorama_image_controls">
        <button class="fotorama_move_image" type="button"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512" width="1em" height="1em" fill="currentColor"><title>Move up</title><!--!Font Awesome Free 6.7.2 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2025 Fonticons, Inc.--><path d="M350 177.5c3.8-8.8 2-19-4.6-26l-136-144C204.9 2.7 198.6 0 192 0s-12.9 2.7-17.4 7.5l-136 144c-6.6 7-8.4 17.2-4.6 26s12.5 14.5 22 14.5l88 0 0 192c0 17.7-14.3 32-32 32l-80 0c-17.7 0-32 14.3-32 32l0 32c0 17.7 14.3 32 32 32l80 0c70.7 0 128-57.3 128-128l0-192 88 0c9.6 0 18.2-5.7 22-14.5z"/></svg></button>
        <button class="fotorama_delete_image" type="button"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" width="1em" height="1em" fill="currentColor"><title>Delete</title><!--!Font Awesome Free 6.7.2 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2025 Fonticons, Inc.--><path d="M135.2 17.7L128 32 32 32C14.3 32 0 46.3 0 64S14.3 96 32 96l384 0c17.7 0 32-14.3 32-32s-14.3-32-32-32l-96 0-7.2-14.3C307.4 6.8 296.3 0 284.2 0L163.8 0c-12.1 0-23.2 6.8-28.6 17.7zM416 128L32 128 53.2 467c1.6 25.3 22.6 45 47.9 45l245.8 0c25.3 0 46.3-19.7 47.9-45L416 128z"/></svg></button>
      </div>
    </li>
  </template>
  <dialog class="fotorama_filebrowser">
    <figure>
      <figcaption>Pick image</figcaption>
      <p>
        <button type="button" class="fotorama_close"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512" width="1em" height="1em" fill="currentColor"><title>Close</title><!--!Font Awesome Free 6.7.2 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2025 Fonticons, Inc.--><path d="M342.6 150.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192 210.7 86.6 105.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L146.7 256 41.4 361.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192 301.3 297.4 406.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.3 256 342.6 150.6z"/></svg></button>
      </p>
      <iframe src="" loading="lazy"></iframe>
    </figure>
  </dialog>
</article>
